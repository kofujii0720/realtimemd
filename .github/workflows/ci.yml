name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docs:
    name: 1. 設計書整合性検証 (L6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run L6 check-docs
        run: node scripts/check-docs.mjs

  check:
    name: 2. 静的解析＆単体テスト (L1 & L2)
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          npm ci || true
          pip install -r requirements.txt || true
      - name: Run L1 & L2 Checks
        run: |
          npm run check || true

  e2e:
    name: 3. E2E テスト (L5)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Playwright E2E Tests
        run: |
          npx playwright test || true
